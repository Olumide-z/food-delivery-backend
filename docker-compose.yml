x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/food_delivery_db
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1

services:
  db:
    image: postgres:17-alpine
    container_name: food_delivery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: food_delivery_db
    volumes:
      # Persists DB data between container restarts
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose DB on host so you can still connect with DBeaver/psql locally
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d food_delivery_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: food_delivery_redis
    restart: unless-stopped
    ports:
      # Expose Redis on host so you can inspect it locally with redis-cli
      - "6379:6379"
    volumes:
      # Persists Redis data between container restarts
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: food_delivery_backend
    container_name: food_delivery_app
    restart: unless-stopped
    env_file:
      # Loads all your .env variables (secrets, mail, AWS, etc.)
      - .env
    environment:
      # Override DATABASE_URL: replace 'localhost' with the db service name
      # Inside Docker, containers talk to each other by service name, not localhost
      # Override REDIS_URL: replace 'localhost' with the redis service name
      <<: *app-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Wait until Postgres is actually ready before starting the app
        condition: service_healthy
      redis:
        # Wait until Redis is actually ready before starting the app
        condition: service_healthy

  celery_worker:
    image: food_delivery_backend     # no second build
    container_name: food_delivery_celery_worker
    restart: unless-stopped
    command: uv run --no-sync celery -A app.core.celery_app:celery_app worker --loglevel=info -E
    env_file: .env
    environment:
      <<: *app-env
    volumes:
      # Mount local source code so task changes are picked up without rebuilding.
      # After adding/editing tasks: docker-compose restart celery_worker
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # app:
      #   condition: service_started   # makes sure the image is built first


  flower:
    image: food_delivery_backend
    container_name: food_delivery_flower
    restart: unless-stopped
    command: uv run --no-sync celery -A app.core.celery_app:celery_app flower --port=5555
    env_file: .env
    environment:
      <<: *app-env
      FLOWER_BASIC_AUTH: ${FLOWER_USER}:${FLOWER_PASSWORD}
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
