[project]
name = "food-delivery-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.19.2",
    "boto3>=1.43.98",
    "fastapi[standard]>=0.141.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
